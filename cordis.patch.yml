# dsh-intl-models bundle patch: one host row.
#
# The row id is also the settings namespace of this plugin's Models-page rows
# (one per endpoint that has keys), where its card renders
# (`settings.models.provider-card`, keyed by this id). Keys live in
# $DSH_HOME/storages/intl-models-keys.json and are managed in the vendor tabs
# of a conversation (OpenAI, Claude, xAI, OpenRouter, OpenCode, Gemini).

- insert:
    - id: dsh-intl-models
      name: dsh-intl-models
      inject: ['llm']
      config: {}
